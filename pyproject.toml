[project]
name = "scambait"
version = "1.0.0"
description = "An AI scam-baiter whose hands are Kane CLI: it follows scam links, proves who gets paid, and builds police-ready evidence."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
