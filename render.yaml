# Render blueprint: New > Blueprint > pick this repo. Secrets marked sync: false are entered in the Render dashboard.
# Render's Python runtime has no browser, so the live site replays real Kane CLI runs recorded from the practice lab
# (scripts/kane_replay.py); every replayed result says so on screen. Live Kane runs on a machine with Chrome.
services:
  - type: web
    name: scambait
    runtime: python
    plan: free
    autoDeploy: false            # deploys come from `make ship`, only after every Kane test passes
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENAI_API_KEY          # Decisions second opinion, moderation, live phone voice
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL           # exactly the https URL Twilio and Telegram call (signatures cover it)
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: KANE_CMD
        value: python /opt/render/project/src/scripts/kane_replay.py   # absolute: Kane runs with out/kane as its working folder
      - key: CONSOLE_ENABLED
        value: "1"
      - key: LIVE_INVESTIGATION
        value: "0"
